name: Deprem Botu Canlı Bağlantı Testi

on:
  # Bir Pull Request (PR) açıldığında bu test otomatik tetiklenecek
  pull_request:

jobs:
  test-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Depodan Çek
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          pip install requests beautifulsoup4

      - name: Botu Çalıştır ve Slack'i Test Et
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MAGNITUDE_THRESHOLD: '5.0'
          CHECK_INTERVAL: '10'
        run: |
          python earthquake-bot/bot.py &
          sleep 15
          kill $!
