services:
  database:
    container_name: database
    image: mysql:8.4.8
    restart: always
    environment:
      MYSQL_DATABASE: {{DB_NAME}}
      MYSQL_USER: {{DB_USER}}
      MYSQL_PASSWORD: {{DB_PASSWORD}}
      MYSQL_ROOT_PASSWORD: {{DB_ROOT_PASSWORD}}
      MYSQL_ROOT_HOST: '%'
      MYSQL_PORT: {{DB_PORT}}
    volumes:
      - ./docker/mysql:/var/lib/mysql
    ports:
      - "127.0.0.1:{{DB_PORT}}:3306"
    networks:
      - ays-network
  cache:
    container_name: cache
    image: 8.4.2-alpine3.22
    restart: always
    volumes:
      - ./docker/redis:/data
    ports:
      - "127.0.0.1:{{CACHE_PORT}}:6379"
    networks:
      - ays-network
  application:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: application
    restart: on-failure
    ports:
      - "127.0.0.1:9790:9790"
    environment:
      - AYS_SPRING_PROFILE=default,cors
      - AYS_CORS_ALLOWED_ORIGINS={{CORS_ALLOWED_ORIGINS}}
      - AYS_DB_PASSWORD={{DB_PASSWORD}}
      - AYS_DB_WRITER_INSTANCE_IP=database
      - AYS_DB_WRITER_INSTANCE_PORT=3306
      - AYS_DB_READER_INSTANCE_IP=database
      - AYS_DB_READER_INSTANCE_PORT=3306
      - AYS_SMTP_USERNAME={{SMTP_USERNAME}}
      - AYS_SMTP_PASSWORD={{SMTP_PASSWORD}}
      - AYS_CACHE_IP=cache
      - AYS_CACHE_PORT=6379
    networks:
      - ays-network
    depends_on:
      - database
      - cache

networks:
  ays-network:
    driver: bridge
