version: '3.8'

services:
  sonarqube:
    image: sonarqube:25.4.0.105899-community
    container_name: sonarqube
    restart: always
    ports:
      - "127.0.0.1:${SQ_WEB_PORT}:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://postgresql:5432/${SQ_DB_NAME}
      - SONAR_JDBC_USERNAME=${SQ_DB_USER}
      - SONAR_JDBC_PASSWORD=${SQ_DB_PASSWORD}
    volumes:
      - ./sonarqube_conf:/opt/sonarqube/conf
      - ./sonarqube_data:/opt/sonarqube/data
      - ./sonarqube_extensions:/opt/sonarqube/extensions
      - ./sonarqube_logs:/opt/sonarqube/logs
      - ./sonarqube_temp:/opt/sonarqube/temp

  postgresql:
    image: postgres:17.4
    container_name: postgresql
    restart: always
    environment:
      - POSTGRES_USER=${SQ_DB_USER}
      - POSTGRES_PASSWORD=${SQ_DB_PASSWORD}
      - POSTGRES_DB=${SQ_DB_NAME}
    volumes:
      - ./postgresql_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:9.2.0
    container_name: pgadmin
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - postgresql
    volumes:
      - ./pgadmin_data:/var/lib/pgadmin

volumes:
  sonarqube_conf:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_temp:
  postgresql_data:
  pgadmin_data:
